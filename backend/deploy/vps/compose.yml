name: onmap-production

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  migrator:
    profiles: ["migration"]
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: migrator
    env_file: ${ONMAP_BACKEND_ENV_FILE:-backend.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    mem_limit: 1536m
    pids_limit: 256

  telegram-preflight:
    profiles: ["telegram-preflight"]
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: migrator
    env_file:
      - path: ${ONMAP_BACKEND_ENV_FILE:-backend.env}
      - path: telegram.env
        required: true
    command: ["node", "dist/scripts/telegram-production-preflight.js"]
    networks:
      - edge
    restart: "no"
    mem_limit: 512m
    pids_limit: 128

  backend:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: runtime
    env_file:
      - path: ${ONMAP_BACKEND_ENV_FILE:-backend.env}
      - path: telegram.env
        required: false
    environment:
      PORT: "4000"
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: /opt/onmap/secrets/onmap-apns-auth-key.p8
        target: /run/secrets/apns-auth-key.p8
        read_only: true
      - type: bind
        source: /opt/onmap/secrets/onmap-fcm-admin.json
        target: /run/secrets/fcm-service-account.json
        read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
